<section class="hero">
  <div class="hero__text">
    <h1 class="hero__title">{{ headline }}<span class="redux"><span class="visually-hidden">, </span>{{ headline_note }}</span></h1>
    <div class="hero__lede">{{ lede }}</div>
  </div>
  <figure class="hero__map">
{{ map }}
    <figcaption>{{ map_caption }}</figcaption>
  </figure>
</section>

<section class="story" aria-labelledby="story">
  <div class="prose">
{{ story_html }}
  </div>
</section>

<section class="catalog" id="versions" aria-labelledby="versions-heading">
  <header class="catalog__head">
    <h2 id="versions-heading">{{ versions_heading }}</h2>
    <p>{{ versions_summary }}</p>
  </header>
{{ version_index }}
</section>
