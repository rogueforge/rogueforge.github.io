<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_name }} - {{ site_tagline }}</title>
  <meta name="description" content="{{ site_description }}">
  <link rel="stylesheet" href="{{ assets_href }}">
</head>
<body class="site-home">
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="{{ home_href }}">
        <img class="brand__logo" src="{{ logo_href }}" alt="" aria-hidden="true">
        <span class="brand__name">{{ site_name }}</span>
      </a>
      <nav class="top-nav" aria-label="Primary">
        <a href="{{ github_href }}">GitHub</a>
      </nav>
    </header>

    <div class="breadcrumbs" aria-label="Breadcrumb">{{ breadcrumb }}</div>

    <main id="main-content" class="layout" tabindex="-1">
      <aside class="aside" aria-label="Site navigation">
        <nav class="nav">
{{ nav }}
        </nav>
      </aside>

      <article class="content">
        <header class="content__header">
          <p class="eyebrow">Welcome</p>
          <h1>{{ site_name }}</h1>
          <p class="content__tagline">{{ site_tagline }}</p>
          <p class="content__description">{{ site_description }}</p>
        </header>

        <section class="content__about">
          <h2>About this project</h2>
{{ readme_html }}
        </section>
      </article>
    </main>

    <footer class="site-footer">
      <p>{{ site_name }} &middot; <a href="{{ github_href }}">GitHub</a></p>
    </footer>
  </div>
</body>
</html>
